services:
  - type: web
    name: civicscope-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civicscope-db
          property: connectionString
      - key: SEED_ON_STARTUP
        value: "true"
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: civicscope-db
    databaseName: civicscope
    user: civicscope
    postgresMajorVersion: 16
    ipAllowList: []
