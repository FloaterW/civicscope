services:
  - type: web
    name: civicscope-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: civicscope-db
          property: connectionString
      # Set to "true" only for initial demo deployment
      - key: SEED_ON_STARTUP
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      # Render terminates public traffic at its proxy; trust its forwarded client address.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: RATE_LIMIT
        value: 60/minute

databases:
  - name: civicscope-db
    databaseName: civicscope
    user: civicscope
    postgresMajorVersion: 16
    ipAllowList: []
