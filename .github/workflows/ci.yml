name: CivicScope CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review high-severity dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  test:
    name: Backend, frontend, and browser checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements-dev.lock

      - name: Audit backend dependencies
        working-directory: backend
        run: pip-audit --require-hashes -r requirements.lock

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Lint frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Start backend API
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-civicscope.db
          SEED_ON_STARTUP: "true"
          RATE_LIMIT: 10000/minute
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("Backend did not become healthy")
          PY

      - name: Show backend log on failure
        if: failure()
        working-directory: backend
        run: cat backend.log || true

      - name: Run browser regression tests
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  postgis:
    name: PostgreSQL/PostGIS migration and geometry checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: civicscope_test
          POSTGRES_USER: civicscope
          POSTGRES_PASSWORD: civicscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicscope -d civicscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://civicscope:civicscope@127.0.0.1:5432/civicscope_test
      POSTGIS_TEST_DATABASE_URL: postgresql+psycopg://civicscope:civicscope@127.0.0.1:5432/civicscope_test
      SEED_ON_STARTUP: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements-dev.lock

      - name: Verify reversible migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Seed and verify native geometry
        working-directory: backend
        run: |
          python etl/seed_demo_data.py
          pytest -q tests/test_postgis_integration.py

  containers:
    name: Build production containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t civicscope-backend ./backend

      - name: Build frontend image
        run: docker build -t civicscope-frontend ./frontend
