name: CivicScope CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Each main push gets its own group; only obsolete PR commits are cancelled.
concurrency:
  group: civicscope-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Review high-severity dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
        with:
          fail-on-severity: high

  backend-tests:
    name: Backend unit and contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-dev.txt

      # Vulnerability audits remain required in dependency-security.yml. Check
      # input/lock parity here as well so tests cannot exercise stale locks.
      - name: Check backend dependency lock consistency
        working-directory: backend
        run: python scripts/check_dependency_locks.py

      - name: Run backend tests
        working-directory: backend
        run: pytest

  windows-locks:
    name: Windows dependency lock closure
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Verify portable hashed dependencies and requested extras
        working-directory: backend
        run: |
          # The hosted Windows Python includes runner tools such as pipx whose
          # dependencies are unrelated to this application. Check a clean env.
          $lockEnvironment = Join-Path $env:RUNNER_TEMP 'civicscope-locks'
          python -m venv $lockEnvironment
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lockPython = Join-Path $lockEnvironment 'Scripts/python.exe'
          & $lockPython -m pip install --require-hashes -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $lockPython scripts/check_dependency_locks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $lockPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $lockPython -m pytest -q tests/test_dependency_locks.py

  frontend-checks:
    name: Frontend unit, type, lint, and build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Test maintained release verification tooling
        working-directory: frontend
        run: npm run test:release-tools

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  browsers:
    name: Browser regressions (${{ matrix.suite }})
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - suite: dashboard
            command: npm run test:e2e
          - suite: trreb-preview
            command: npm run test:e2e:trreb
          - suite: trreb-public
            command: npm run test:e2e:trreb-public
          - suite: trreb-archive
            command: npx playwright test --config playwright.trreb-archive.config.ts
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start backend API
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-civicscope.db
          SEED_ON_STARTUP: "true"
          RATE_LIMIT: 10000/minute
          CORS_ORIGINS: http://127.0.0.1:3101,http://127.0.0.1:3105
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("Backend did not become healthy")
          PY

      # Public and archive modes have different build-time flags. Their own
      # Playwright configurations build isolated production bundles in each job.
      - name: Run browser suite
        working-directory: frontend
        run: ${{ matrix.command }}

      - name: Show backend log after a browser or startup failure
        if: failure()
        working-directory: backend
        run: cat backend.log || true

      - name: Stop owned backend process
        if: always()
        working-directory: backend
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi

      - name: Upload browser and backend failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-${{ matrix.suite }}
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/backend.log
          if-no-files-found: ignore

  test:
    # Preserve the protected-branch check name while aggregating every split job.
    name: Backend, frontend, and browser checks
    needs: [dependency-review, backend-tests, windows-locks, frontend-checks, browsers, postgis, containers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require successful complete validation
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/check_ci_results.py

  postgis:
    name: PostgreSQL/PostGIS migration and geometry checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: civicscope_test
          POSTGRES_USER: civicscope
          POSTGRES_PASSWORD: civicscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicscope -d civicscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://civicscope:civicscope@127.0.0.1:5432/civicscope_test
      POSTGIS_TEST_DATABASE_URL: postgresql+psycopg://civicscope:civicscope@127.0.0.1:5432/civicscope_test
      SEED_ON_STARTUP: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install --require-hashes -r requirements-dev.txt

      - name: Verify reversible migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Seed and verify native geometry
        working-directory: backend
        run: |
          python etl/seed_demo_data.py
          pytest -q tests/test_postgis_integration.py tests/test_trreb_postgres.py tests/test_cmhc_corrections_postgres.py

  containers:
    name: Build production containers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: civicscope_smoke
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: local-smoke-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smoke -d civicscope_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build backend image
        run: docker build -t civicscope-backend ./backend

      - name: Smoke-test backend startup with production proxy arguments
        run: |
          docker run -d --name backend-smoke --network host \
            -e DATABASE_URL=postgresql+psycopg://smoke:local-smoke-only@127.0.0.1:5432/civicscope_smoke \
            -e PORT=8014 -e SEED_ON_STARTUP=false -e FORWARDED_ALLOW_IPS='*' civicscope-backend
          python - <<'PY'
          import json
          import time
          import urllib.request
          for attempt in range(45):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8014/health', timeout=2) as response:
                      if json.load(response).get('status') == 'ok':
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit('Backend container did not become healthy')
          PY

      - name: Report and remove backend smoke container
        if: always()
        run: |
          docker logs backend-smoke || true
          docker rm -f backend-smoke || true

      - name: Build frontend image
        run: docker build -t civicscope-frontend ./frontend
