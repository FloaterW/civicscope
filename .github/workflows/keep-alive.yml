name: Production health checks

permissions:
  contents: read
  issues: write

on:
  schedule:
    # Best effort only: scheduled jobs may be delayed; free hosting still sleeps.
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: production-monitor
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # Five endpoints, two attempts each, at most75s +5s retry delay per endpoint.
    # Leave time for setup and incident reporting during a persistent outage.
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check frontend, database, API data and coverage
        id: monitor
        run: python scripts/monitor.py
      - name: Open or resolve one incident issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ steps.monitor.outcome }}
        run: python scripts/workflow_alert.py --title 'Production monitoring incident' --result "$CHECK_RESULT"
      - name: Open or resolve one source verification issue
        if: always() && (steps.monitor.outputs.freshness_result == 'success' || steps.monitor.outputs.freshness_result == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ steps.monitor.outputs.freshness_result }}
        run: python scripts/workflow_alert.py --title 'Source verification overdue or unknown' --result "$CHECK_RESULT"
