name: Keep Backend Alive

on:
  schedule:
    # Ping every 14 minutes to prevent Render free-tier spin-down
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://civicscope.onrender.com/health || echo "000")
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Backend is healthy"
          else
            echo "Backend returned non-200 status (may be waking up)"
          fi
