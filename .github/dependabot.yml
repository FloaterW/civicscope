version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Revisit when the active Next/ESLint integration officially supports TS7.
    # Do not disable lint or override peer compatibility to merge this migration.
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0 <8.0.0"]
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    # Node 25 is EOL. A future LTS migration must align Docker, CI and typings.
    ignore:
      - dependency-name: node
        versions: [">=25.0.0 <26.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
