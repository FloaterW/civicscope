services:
  db:
    image: postgis/postgis:16-3.4
    container_name: civicscope-db
    environment:
      POSTGRES_DB: civicscope
      POSTGRES_USER: civicscope
      POSTGRES_PASSWORD: civicscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicscope -d civicscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: civicscope-backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://civicscope:civicscope@db:5432/civicscope
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3101,http://127.0.0.1:3101
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
    container_name: civicscope-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
